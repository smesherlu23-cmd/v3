[project]
name = "centurio"
version = "1.2.0"
description = "Centurio — панель запуска приложений для Windows, всегда доступная из трея."
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "flet[desktop]==0.28.3",
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
    "psutil>=5.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Корень — чтобы импортировался пакет app, tests — для общего helpers.py.
pythonpath = [".", "tests"]
addopts = "-q"

[tool.flet]
# Эти значения уезжают в VERSIONINFO собранного Centurio.exe. Пустые или
# мусорные свойства файла — самостоятельный признак для эвристик антивирусов
# (раньше здесь стояло copyright = "."), а репутация в SmartScreen копится на
# пару «издатель + имя файла», поэтому менять их от релиза к релизу нельзя.
org = "com.centurio"
product = "Centurio"
company = "Centurio"
copyright = "© Centurio"
build_version = "1.2.0"
build_number = 1

[tool.flet.app]
path = "."
# Всё, кроме самого приложения, в app.zip не нужно. Без этого списка туда
# уезжал весь репозиторий — вместе с .git (на раннере в .git/config лежит
# токен actions/checkout), тестами и кэшами. Сравнивается точный путь от
# корня проекта; каталог build исключает сам `flet build`.
exclude = [
    ".git",
    ".github",
    ".gitattributes",
    ".gitignore",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "venv",
    "__pycache__",
    "installer",
    "scripts",
    "tests",
]
