name: Release

# Собирает дистрибутив на Windows и выкладывает его в релиз GitHub.
#
# Ручной запуск (workflow_dispatch) собирает и оставляет артефакты в прогоне —
# этим удобно проверять сборку, ничего не публикуя. Тег `v1.2.3` дополнительно
# создаёт релиз; версия в теге обязана совпадать с версией в исходниках,
# иначе прогон падает до сборки.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_DIR: build/windows
  SETUP_EXE: installer/Output/CenturioSetup.exe
  # Консоль раннера — cp1252, а `flet build` рисует прогресс символами вроде
  # U+25CF: без этого сборка падает в UnicodeEncodeError, не начавшись.
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  build:
    # Не `windows-latest`: на нём Visual Studio 2026, а Flutter, которого
    # тянет `flet build`, ищет для CMake генератор по версии Visual Studio и
    # на незнакомой падает с «could not find any instance of Visual Studio».
    # На образе с VS 2022 сборка проверена. Тесты в ci.yml это не касается —
    # они собираются без Flutter.
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4
        with:
          # Токен в .git/config сборке не нужен; ни к чему ему и лежать рядом
          # с исходниками, которые упаковываются в дистрибутив.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # С Flet 1.0 команда `flet build` — отдельный пакет; версия та же,
          # что у flet в requirements.txt (сверяет test_packaging_metadata).
          pip install "flet-cli==1.0.4"
          pip install pytest ruff

      # Версии в app/__init__.py, pyproject.toml и centurio.iss сверяет
      # test_packaging_metadata. Здесь остаётся сверить их с тегом.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (python -c "from app import __version__; print(__version__)").Trim()
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne $tag) {
            throw "тег $tag не совпадает с версией в исходниках $version"
          }
          "версия $version" | Write-Host

      # Описание релиза — раздел версии из CHANGELOG.md и памятка по
      # установке. Без раздела тег падает здесь, до получасовой сборки, а не
      # на публикации. Пока подпись не настроена, памятка объясняет SmartScreen.
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_DLIB: ${{ secrets.SIGNING_DLIB }}
        run: |
          $flags = @()
          if (-not $env:SIGNING_DLIB) { $flags += "--unsigned" }
          python scripts/release_notes.py "${{ github.ref_name }}" installer/Output/RELEASE_NOTES.md @flags
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Lint
        run: python -m ruff check .

      - name: Test
        env:
          CI: "1"
        run: python -m pytest -q

      # --yes: с Flet 1.0 `flet build` спрашивает, ставить ли Flutter SDK, и
      # без ответа на раннере падает на чтении ввода.
      - name: Build the application
        run: flet build windows --yes --verbose

      # До подписи: правка ресурса подпись ломает. Без этого собранный exe
      # у пользователя с кириллицей в имени профиля закрывается за секунду,
      # не оставив ни строчки лога, — см. scripts/utf8_manifest.ps1.
      - name: Switch the exe to the UTF-8 code page
        shell: pwsh
        run: ./scripts/utf8_manifest.ps1 -Path "${{ env.BUILD_DIR }}/Centurio.exe"

      # Собранный exe обязан реально запуститься: тесты гоняют Python-код
      # напрямую и склейку Flutter со встроенным Python не видят — сборка,
      # которая «сразу вылетает», уже уезжала к пользователю.
      - name: Smoke test the built app
        shell: pwsh
        run: ./scripts/smoke.ps1 -BuildDir "${{ env.BUILD_DIR }}"

      - name: Smoke test the built app under a Cyrillic user profile
        shell: pwsh
        run: ./scripts/smoke.ps1 -BuildDir "${{ env.BUILD_DIR }}" -NonAsciiProfile

      - name: Sign the application
        shell: pwsh
        env:
          SIGNING_DLIB: ${{ secrets.SIGNING_DLIB }}
          SIGNING_METADATA: ${{ secrets.SIGNING_METADATA }}
        run: ./scripts/sign.ps1 -Path "${{ env.BUILD_DIR }}/Centurio.exe"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Download the VC++ Redistributable
        shell: pwsh
        run: |
          # Зашивается прямо в CenturioSetup.exe (см. installer/centurio.iss)
          # и ставится тихо, только если её ещё нет на машине пользователя —
          # без неё Flutter-приложение на чистой Windows не запускается.
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" `
            -OutFile "installer\vc_redist.x64.exe"

      - name: Build the installer
        shell: pwsh
        run: |
          # Скобки обязательны: `$env:ProgramFiles(x86)` PowerShell читает как
          # `$env:ProgramFiles` плюс литерал «(x86)» и ищет ISCC.exe в
          # «C:\Program Files(x86)» — без пробела, то есть нигде.
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\centurio.iss

      - name: Sign the installer
        shell: pwsh
        env:
          SIGNING_DLIB: ${{ secrets.SIGNING_DLIB }}
          SIGNING_METADATA: ${{ secrets.SIGNING_METADATA }}
        run: ./scripts/sign.ps1 -Path "${{ env.SETUP_EXE }}"

      # Путь человека, скачавшего релиз: установка, запуск установленного,
      # обновление поверх запущенного и закрытого, удаление. Тот же
      # установщик, что уедет в релиз, — уже подписанный.
      - name: Install, update and uninstall
        shell: pwsh
        run: |
          $version = (python -c "from app import __version__; print(__version__)").Trim()
          ./scripts/install_check.ps1 -Setup "${{ env.SETUP_EXE }}" -Version $version

      - name: Checksums
        shell: pwsh
        run: |
          Get-FileHash "${{ env.SETUP_EXE }}" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  CenturioSetup.exe" } |
            Set-Content -Encoding ascii installer/Output/SHA256SUMS.txt
          Get-Content installer/Output/SHA256SUMS.txt | Write-Host

      # Манифесты winget и scoop с адресом и хешем этого установщика: их
      # остаётся отправить в каталоги (см. README, «Релиз»).
      - name: Package manifests
        shell: pwsh
        run: |
          $version = (python -c "from app import __version__; print(__version__)").Trim()
          $hash = (Get-FileHash "${{ env.SETUP_EXE }}" -Algorithm SHA256).Hash
          python scripts/package_manifests.py --version $version --sha256 $hash `
            --out installer/Output/manifests
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Compress-Archive -Path installer/Output/manifests/* -Force `
            -DestinationPath installer/Output/package-manifests.zip

      # Инсталлятор — единственное, что имеет смысл раздавать: `flet build`
      # кладёт рядом с Centurio.exe набор DLL, и без них голый exe не
      # запустится. Каталог сборки уезжает архивом только для разбора проблем.
      - uses: actions/upload-artifact@v4
        with:
          name: CenturioSetup
          path: |
            ${{ env.SETUP_EXE }}
            installer/Output/SHA256SUMS.txt
            installer/Output/package-manifests.zip

      - uses: actions/upload-artifact@v4
        with:
          name: centurio-windows-build
          path: ${{ env.BUILD_DIR }}

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" `
            "${{ env.SETUP_EXE }}" installer/Output/SHA256SUMS.txt `
            installer/Output/package-manifests.zip `
            --title "Centurio ${{ github.ref_name }}" `
            --notes-file installer/Output/RELEASE_NOTES.md
