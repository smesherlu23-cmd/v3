name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  # Centurio написан под Windows: 12 модулей из 58 не выполняются больше нигде.
  # Проверка только на Ubuntu оставляла реестр, поиск установленного, раскладку
  # окон, трей и автозапуск без единого автоматического прогона.
  check:
    name: ${{ matrix.os }} · Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Lint
        run: python -m ruff check .

      - name: Test
        env:
          CI: "1"
        run: python -m pytest -q
